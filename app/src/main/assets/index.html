<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Lumi Match</title><style>
:root{color-scheme:light;--ink:#30283e;--purple:#7958cd;--muted:#877d94}*{box-sizing:border-box}body{margin:0;background:#f8f5ee;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}main{max-width:460px;margin:auto;padding:26px 24px calc(24px + env(safe-area-inset-bottom))}.brand{font-size:12px;letter-spacing:4px;font-weight:800;color:var(--purple);display:flex;justify-content:space-between;align-items:center}.brand span{font-size:22px;letter-spacing:0}h1{font-size:38px;line-height:1.13;letter-spacing:-1.7px;margin:24px 0 12px}h1 em{font-style:normal;color:var(--purple)}.sub{font-size:14px;color:var(--muted);margin:0 0 26px}.stats{display:flex;gap:10px}.stat{flex:1;text-align:center;background:#fffaf4;border:1px solid #eae4dc;border-radius:18px;padding:13px 4px}.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.stat strong{font-size:22px}.board-title{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;color:var(--muted);margin:26px 1px 12px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{border:0;border-radius:19px;aspect-ratio:1.12;background:var(--purple);color:#e9ddff;font-size:30px;box-shadow:0 4px 0 #6344b1;cursor:pointer;transition:transform .16s,background .2s;position:relative}.card:before{content:"";position:absolute;inset:7px;border:1px solid #ffffff22;border-radius:13px}.card:active{transform:scale(.95)}.card.open{background:#fff;color:var(--ink);box-shadow:0 4px 0 #e6dfd3;transform:rotate(-2deg)}.card.matched{background:#e2edda;box-shadow:0 4px 0 #c6d6b9;transform:none}.card:focus-visible,.restart:focus-visible{outline:3px solid #dbad53;outline-offset:4px}.message{text-align:center;min-height:23px;font-size:13px;color:var(--muted);margin:23px 0 16px}.restart{width:100%;border:1px solid #ded4ef;border-radius:16px;padding:16px;background:#eee6f8;color:#5f438e;font-weight:700;font-size:15px;cursor:pointer}.footer{text-align:center;font-size:10px;letter-spacing:2px;color:#a198aa;margin-top:24px}.badge{display:block;object-fit:contain;width:105px;height:44px;margin:13px auto 0;opacity:.8}.celebrate{color:#5c8546;font-weight:700}@media(max-height:730px){main{padding-top:17px}h1{font-size:32px;margin-top:17px}.sub{margin-bottom:18px}.board-title{margin-top:18px}.card{aspect-ratio:1.3}.message{margin-top:18px}.footer{margin-top:17px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><div class="brand">✦ LUMI PLAY <span aria-hidden="true">☼</span></div><h1>A little moment<br>of <em>matching magic.</em></h1><p class="sub">翻开卡片，找到每一对小美好。</p><div class="stats"><div class="stat"><small>步数</small><strong id="moves">0</strong></div><div class="stat"><small>已配对</small><strong id="pairs">0 / 6</strong></div><div class="stat"><small>最佳步数</small><strong id="best">—</strong></div></div><div class="board-title"><span>THE LITTLE FRUIT CLUB</span><span>12 张 · 6 对</span></div><div class="board" id="board" aria-label="水果记忆翻牌游戏"></div><p class="message" id="message" role="status" aria-live="polite">慢慢来，好运藏在下一张。</p><button class="restart" id="restart">↻ &nbsp; 开始新一局</button><div class="footer">MATCH · SMILE · REPEAT</div><img class="badge" src="platform.png" alt="Google Play 平台标识"></main><script>
'use strict';
const fruits=['🍋','🍒','🥝','🍇','🍊','🍓'];
const board=document.getElementById('board');let cards=[],first=null,second=null,locked=false,moves=0,pairs=0,timer=null,best=0;
try{best=Number(localStorage.getItem('lumi.best'))||0}catch(e){}
function render(){document.getElementById('moves').textContent=moves;document.getElementById('pairs').textContent=pairs+' / 6';document.getElementById('best').textContent=best||'—';cards.forEach((card,i)=>{const shown=card.matched||i===first||i===second;const b=board.children[i];b.textContent=shown?card.fruit:'✦';b.className='card'+(card.matched?' matched':shown?' open':'');b.setAttribute('aria-label',card.matched?'已配对 '+card.fruit:shown?card.fruit:'翻开第 '+(i+1)+' 张卡片');b.setAttribute('aria-pressed',String(shown));b.disabled=card.matched;});}
function reset(){clearTimeout(timer);first=second=null;locked=false;moves=pairs=0;cards=[...fruits,...fruits].map(fruit=>({fruit,matched:false}));for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}board.replaceChildren();cards.forEach((_,i)=>{const b=document.createElement('button');b.type='button';b.addEventListener('click',()=>flip(i));board.appendChild(b)});document.getElementById('message').textContent='慢慢来，好运藏在下一张。';document.getElementById('message').className='message';render()}
function flip(i){if(locked||cards[i].matched||i===first)return;if(first===null){first=i;render();return}second=i;moves++;if(cards[first].fruit===cards[second].fruit){cards[first].matched=cards[second].matched=true;pairs++;first=second=null;if(pairs===6){if(!best||moves<best){best=moves;try{localStorage.setItem('lumi.best',String(best))}catch(e){}}document.getElementById('message').textContent='✦ 全部配对成功！用了 '+moves+' 步，真棒。';document.getElementById('message').className='message celebrate'}render()}else{locked=true;render();timer=setTimeout(()=>{first=second=null;locked=false;render()},850)}}
document.getElementById('restart').addEventListener('click',reset);reset();
</script></body></html>
